name: Live portal structural checker
on:
  push:
    branches: [codex/live-portal-checker, codex/general-frame-checker, codex/frame-worked-solutions]
  workflow_dispatch:
    inputs:
      proof_only:
        description: Check current source and exact packets without running an installed bundle
        type: boolean
        required: false
        default: false
      build_wasm:
        description: Deliberately build the proved portal checker twice and test the actual browser artifact
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: mkdir -p .data/live-portal
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check profile, exact candidates and revision binding
        run: node --test tests/portal-live.test.mjs tests/portal-runtime.test.mjs tests/model-evidence.test.mjs tests/portal-frame-pilot.test.mjs tests/frame-candidate.test.mjs
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'true'
      - name: Compile the exact structural checker and actual-model bridge
        shell: bash
        run: |
          set -euo pipefail
          cd proofs
          lake build ExactGeometry FrameReuse
          lake env bash -c '
            set -euo pipefail
            export LEAN_PATH="$PWD:$LEAN_PATH"
            for module in PortalTables PortalChecker PortalFramePilot PortalSoundness RationalFrameModel RationalFramePartition RationalFrameChecker RationalFrameWire; do
              lean -o "$module.olean" "$module.lean" 2>&1 | tee "../.data/live-portal/$module.log"
            done
          '
          git diff --exit-code -- lake-manifest.json lean-toolchain
          lake env bash -c 'cc -fsyntax-only -I"$(lean --print-prefix)/include" ../qa/general-frame/abi.c'
      - name: Compile the frozen inclined foundation (no frame acceptance claim)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/frame-interval.test.mjs tests/inclined-reference.test.mjs
          cd proofs
          failed=0
          for module in FrameIntervalOps FrameEnclosure FrameIntervalGeometry FrameIntervalGeometrySound FrameIntervalTrig FrameIntervalTrigSound FrameAdmissiblePoint FrameReducedStability; do
            if ! lake env bash -c 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean -o "$1.olean" "$1.lean"' -- "$module" 2>&1 | tee "../.data/live-portal/$module.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Audit the frozen inclined foundation claims
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/live-portal/audit.py --inclined-foundation --emit .data/live-portal/InclinedFoundationAudit.lean
          cd proofs
          lake env bash -c 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean ../.data/live-portal/InclinedFoundationAudit.lean' 2>&1 | tee ../.data/live-portal/inclined-foundation-axioms.log
          cd ..
          python3 qa/live-portal/audit.py --inclined-foundation --check .data/live-portal/inclined-foundation-axioms.log --output .data/live-portal/inclined-foundation-axiom-audit.json
      - name: Exercise the generic source decoder and exact predicate
        shell: bash
        run: |
          set -euo pipefail
          node qa/general-frame/packets.mjs
          cd proofs
          lake env bash -c 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean --run ../qa/general-frame/NativePackets.lean ../.data/general-frame-packets' | tee ../.data/live-portal/generic-packets.log
      - name: Measure bounded exact-arithmetic growth on the three fixed cases
        shell: bash
        run: |
          set -euo pipefail
          node qa/general-frame/measure-growth.mjs | tee .data/live-portal/generic-candidate-growth.json
          cd proofs
          lake env bash -c 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean --run ../qa/general-frame/MeasurePackets.lean ../.data/general-frame-growth' | tee ../.data/live-portal/generic-checker-timing.log
      - name: Check generic finite factor algebra
        shell: bash
        run: |
          set -euo pipefail
          cd proofs
          failed=0
          for module in RationalFrameAlgebra RationalFrameFields RationalFrameInterpretation RationalFrameGeometry RationalFrameContract RationalFrameAssembly RationalFrameRecovery RationalFrameConstraints RationalFrameWork RationalFrameEquations RationalFrameReactions RationalFrameFreeSpace RationalFrameStability RationalFrameSoundness; do
            if ! lake env bash -c 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean -o "$1.olean" "$1.lean"' -- "$module" | tee "../.data/live-portal/$module.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Audit every structural checker bridge theorem
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/live-portal/audit.py --emit .data/live-portal/PortalAudit.lean
          cd proofs
          lake env bash -c 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean ../.data/live-portal/PortalAudit.lean' | tee ../.data/live-portal/axioms.log
          cd ..
          python3 qa/live-portal/audit.py --check .data/live-portal/axioms.log --output .data/live-portal/axiom-audit.json
          python3 qa/live-portal/audit.py --frame --emit .data/live-portal/FrameAudit.lean
          cd proofs
          lake env bash -c 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean ../.data/live-portal/FrameAudit.lean' | tee ../.data/live-portal/frame-axioms.log
          cd ..
          python3 qa/live-portal/audit.py --frame --check .data/live-portal/frame-axioms.log --output .data/live-portal/frame-axiom-audit.json
          python3 -m unittest discover -s qa/live-portal -p 'test_*.py' -v
      - name: Reject a corrupted stiffness table through the actual-model proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_wasm }}
        run: cd proofs && lake env python3 ../qa/live-portal/negative-table.py
      - uses: pnpm/action-setup@v4
        if: ${{ !inputs.proof_only && ((github.event_name == 'workflow_dispatch' && inputs.build_wasm) || hashFiles('public/portal-checker/bundle/manifest.json') != '') }}
        with:
          version: '11.25.0'
      - name: Test the installed structural bundle in the final workspace
        if: ${{ !inputs.proof_only && hashFiles('public/portal-checker/bundle/manifest.json') != '' && !(github.event_name == 'workflow_dispatch' && inputs.build_wasm) }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check
          pnpm test
          python3 qa/live-portal/check-installed.py
      - name: Prepare the deliberate structural artifact build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_wasm }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check
          pnpm test
          mkdir -p .data/live-portal-build
          cp .data/live-portal/axiom-audit.json .data/live-portal/frame-axiom-audit.json .data/live-portal-build/
          cd proofs
          lake env bash -c 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean -c ../.data/live-portal-build/PortalChecker.c PortalChecker.lean'
          lake env bash -c 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean -c ../.data/live-portal-build/RationalFrameWire.c RationalFrameWire.lean'
      - name: Reproduce the structural WASM and test the live portal workspace
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_wasm }}
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/wasm-feasibility/gate.py --frame 2>&1 | tee .data/live-portal-build/build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_wasm }}
        with:
          name: live-portal-compiled
          include-hidden-files: true
          path: |
            .data/live-portal-build
            .data/wasm-build/canonical/browser-trace.zip
            .data/wasm-build/canonical/portal-accepted.png
            .data/wasm-build/canonical/main-affine-accepted.png
            .data/wasm-build/canonical/browser-results.json
            public/portal-checker/bundle
            !.data/live-portal-build/browser/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && !inputs.proof_only && hashFiles('public/portal-checker/bundle/manifest.json') != '' && !(github.event_name == 'workflow_dispatch' && inputs.build_wasm) }}
        with:
          name: live-portal-browser
          path: |
            .data/live-portal-browser/browser-results.json
            .data/live-portal-browser/browser-trace.zip
            .data/live-portal-browser/portal-accepted.png
            .data/live-portal-browser/main-affine-accepted.png
            .data/live-portal-browser/package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-portal-proof
          path: .data/live-portal
