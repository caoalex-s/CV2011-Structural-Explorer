name: Existing WASM browser diagnostic
on:
  push:
    branches: [codex/lean419-wasm-browser-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify existing artifact and run unchanged browser harness once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .data/wasm-browser-diagnostic
          python3 qa/wasm-feasibility/browser-diagnostic.py 2>&1 | tee .data/wasm-browser-diagnostic/diagnostic.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-wasm-browser-diagnostic
          path: .data/wasm-browser-diagnostic
