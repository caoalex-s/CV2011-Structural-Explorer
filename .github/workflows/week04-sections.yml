name: Check Week 04 sections
on:
  push:
    branches: [codex/week04-truss-sections]
permissions:
  contents: read
  actions: read
jobs:
  equilibrium:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'true'
      - run: lake env lean Week04Sections.lean
        working-directory: proofs
      - name: Compile source-derived truss checker
        working-directory: proofs
        run: |
          lake env bash -euc 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean -o IdealTrussWire.olean -c IdealTrussWire.c IdealTrussWire.lean; lean -c Week04SectionWire.c Week04SectionWire.lean'
      - name: Link browser checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash qa/member-diagram/build-runtime.sh week04-section
      - uses: actions/upload-artifact@v4
        with:
          name: week04-section-checker
          path: .data/hinge-build/week04-section-assets/
          include-hidden-files: true
      - name: Compare the installed browser checker with this build
        run: diff -qr public/portal-checker/week04-section .data/hinge-build/week04-section-assets
  student:
    strategy:
      fail-fast: false
      matrix:
        mode: [offline, pilot]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - run: python3 -m pip install -r requirements.txt
        if: matrix.mode == 'pilot'
      - name: Exercise a student drawing in a fresh browser
        env:
          REPLAY_MODE: ${{ matrix.mode }}
        run: |
          if [[ "$REPLAY_MODE" == pilot ]]; then
            EXPLORER_DATA="$RUNNER_TEMP/truss-synthetic" python3 -m server.app --port 8765 > "$RUNNER_TEMP/truss-server.log" 2>&1 &
          else
            python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/truss-server.log" 2>&1 &
          fi
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
          node qa/week04-sections/section-truss-student-replay.mjs "file://$PWD/.data/student-tools/node_modules/playwright/index.mjs" http://127.0.0.1:8765/ ".data/student-results/$REPLAY_MODE" "$REPLAY_MODE"
          if [[ "$REPLAY_MODE" == offline ]]; then
            node qa/week04-sections/check-source.mjs http://127.0.0.1:8765/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sections-student-${{ matrix.mode }}
          path: .data/student-results/
          include-hidden-files: true
