name: Check ideal planar truss
on:
  push:
    branches: [codex/ideal-planar-truss]
permissions:
  contents: read
  actions: read
jobs:
  equilibrium:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'true'
      - run: lake env lean IdealPlanarTruss.lean
        working-directory: proofs
      - name: Compile source-derived truss checker
        working-directory: proofs
        run: lake env lean -c IdealTrussWire.c IdealTrussWire.lean
      - name: Link browser checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash qa/member-diagram/build-runtime.sh ideal-truss
      - uses: actions/upload-artifact@v4
        with:
          name: ideal-truss-checker
          path: .data/hinge-build/ideal-truss-assets/
          include-hidden-files: true
      - name: Compare the installed browser checker with this build
        run: diff -qr public/portal-checker/ideal-truss .data/hinge-build/ideal-truss-assets
  student:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise a student drawing in a fresh browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/truss-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
          node qa/ideal-truss/truss-exercise-student-replay.mjs "file://$PWD/.data/student-tools/node_modules/playwright/index.mjs" http://127.0.0.1:8765/ .data/student-results/offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truss-student-evidence
          path: .data/student-results/
          include-hidden-files: true
