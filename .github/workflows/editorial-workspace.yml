name: Review editorial workspace
on:
  push:
    branches: [codex/editorial-workspace]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: '45151143153'
          github-token: ${{ github.token }}
          path: .data/live-release
      - name: Serve the exact deployed baseline and development candidate
        run: |
          baseline=.data/baseline/CV2011-Structural-Explorer
          mkdir -p "$baseline"
          tar -xf .data/live-release/artifact.tar -C "$baseline"
          jq -e '.commit == "6a09e2012abc4c8ede01291f43e7dacadaaa7e32"' "$baseline/verification.json"
          python3 -m http.server 8764 --bind 127.0.0.1 --directory .data/baseline > "$RUNNER_TEMP/baseline.log" 2>&1 &
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/candidate.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
      - name: Compare seven routes, desktop and mobile
        run: node qa/editorial/replay.mjs "file://$PWD/.data/student-tools/node_modules/playwright/index.mjs" http://127.0.0.1:8764/CV2011-Structural-Explorer/ http://127.0.0.1:8765/ .data/editorial-evidence/comparison
      - name: Check file imports and offline mechanics
        if: success() || failure()
        run: |
          node qa/editorial/navigation.mjs
          node qa/frame-import/readiness.mjs
          playwright="file://$PWD/.data/student-tools/node_modules/playwright/index.mjs"
          fixture=qa/inclined-frame/published-fixtures/cantilever-interior
          node qa/frame-import/frame-import-review-replay.mjs "$playwright" http://127.0.0.1:8765/ "$fixture.request.json" "$fixture.report" .data/editorial-evidence/independent
          mkdir -p .data/independent-portal
          cp qa/portal-moment-exercise/portal-exercise-*.mjs qa/inclined-diagram/member-diagram-inclined-reference.mjs .data/independent-portal/
          node .data/independent-portal/portal-exercise-student-replay.mjs "$playwright" http://127.0.0.1:8765/ .data/editorial-evidence/portal offline
          node qa/ideal-truss/truss-exercise-student-replay.mjs "file://$PWD/.data/student-tools/node_modules/playwright/index.mjs" http://127.0.0.1:8765/ .data/editorial-evidence/truss offline
          node qa/week04-sections/section-truss-student-replay.mjs "$playwright" http://127.0.0.1:8765/ .data/editorial-evidence/sections offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-preview
          path: .data/editorial-evidence/
          include-hidden-files: true
