name: Check frame import readiness
on:
  push:
    branches: [codex/frame-import-readiness, codex/inclined-smoke-cancellation]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise delayed startup, file reads and the actual inclined checker
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/import-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
          node qa/frame-import/readiness.mjs
          playwright="file://$PWD/.data/student-tools/node_modules/playwright/index.mjs"
          fixture=qa/inclined-frame/published-fixtures/cantilever-interior
          node qa/frame-import/frame-import-review-replay.mjs "$playwright" http://127.0.0.1:8765/ "$fixture.request.json" "$fixture.report" .data/import-evidence/independent
          mkdir -p .data/independent-portal
          cp qa/portal-moment-exercise/portal-exercise-*.mjs qa/inclined-diagram/member-diagram-inclined-reference.mjs .data/independent-portal/
          node .data/independent-portal/portal-exercise-student-replay.mjs "$playwright" http://127.0.0.1:8765/ .data/import-evidence/portal offline
          node qa/ideal-truss/truss-exercise-student-replay.mjs "file://$PWD/.data/student-tools/node_modules/playwright/index.mjs" http://127.0.0.1:8765/ .data/import-evidence/truss offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-import-evidence
          path: .data/import-evidence/
          include-hidden-files: true
