name: Verify rotational springs
on:
  push:
    branches: [codex/frame-rotational-springs]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/frame-hinge-candidate.test.mjs
      - run: node qa/hinge-frame/packets.mjs
      - run: node qa/inclined-release/packets.mjs
      - run: node qa/frame-spring/packets.mjs
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'true'
      - id: dependencies
        name: Identify unchanged proof dependencies
        run: echo "key=$(git ls-tree -r HEAD proofs | grep -Ev 'proofs/(InclinedRelease|FrameSpring)' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: proof-cache
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-release-proof-v1-${{ steps.dependencies.outputs.key }}
      - name: Compile and exercise the source-derived hinge checker
        working-directory: proofs
        run: |
          lake build MemberCutAdapter
          lake env bash -euc '
            set -o pipefail
            export LEAN_PATH="$PWD:$LEAN_PATH"
            for module in RationalFrameModel RationalFramePartition RationalFrameChecker RationalFrameWire HingeFrameChecker HingeFrameWire; do
              case "$module" in
                HingeFrame*) lean -c "$module.c" -o "$module.olean" "$module.lean" ;;
                *) lean -o "$module.olean" "$module.lean" ;;
              esac
            done
            for module in RationalFrameAlgebra RationalFrameFields RationalFrameInterpretation RationalFrameAssembly RationalFrameRecovery; do
              lean -o "$module.olean" "$module.lean"
            done
            lean HingeFrameSoundness.lean
            lean --run ../qa/hinge-frame/NativePackets.lean ../.data/hinge-packets
            python3 ../qa/inclined-release/compile.py FrameSpringWire
            lean --run ../qa/frame-spring/Native.lean ../.data/frame-spring/*.packet ../.data/frame-spring/*.reject
            lean --run ../qa/inclined-release/Native.lean ../.data/inclined-release/*.packet ../.data/inclined-release/*.reject
          '
      - run: node qa/inclined-release/check-native-reports.mjs
      - run: node qa/frame-spring/check-native-reports.mjs
      - name: Link the browser checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash qa/hinge-frame/build-runtime.sh
      - name: Compare all installed release checkers with the clean Linux builds
        run: |
          diff -qr public/portal-checker/hinge .data/hinge-build/assets
          diff -qr public/portal-checker/inclined-release .data/hinge-build/inclined-assets
          diff -qr public/portal-checker/spring .data/hinge-build/spring-assets
      - uses: actions/upload-artifact@v4
        with:
          name: inclined-release-checker
          path: .data/hinge-build/inclined-assets/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: hinge-browser-checker
          path: .data/hinge-build/assets/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: spring-checker
          path: .data/hinge-build/spring-assets/
          include-hidden-files: true
  development-student-drawings:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: node scripts/check-inclined-bundle.mjs
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise ordinary drawing controls on the development site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/hinge-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node qa/hinge-frame/run-student-browser.mjs http://127.0.0.1:8765/ stage3
          node qa/hinge-frame/run-student-browser.mjs http://127.0.0.1:8765/ springs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-canvas-development
          path: .data/student-results/
          include-hidden-files: true
  spring-soundness:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'true'
      - id: dependencies
        name: Identify unchanged proof dependencies
        run: echo "key=$(git ls-tree -r HEAD proofs | grep -Ev 'proofs/(InclinedRelease|FrameSpring)' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: proof-cache
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-release-proof-v1-${{ steps.dependencies.outputs.key }}
      - name: Compile reusable interval mechanics
        if: steps.proof-cache.outputs.cache-hit != 'true'
        working-directory: proofs
        run: |
          lake build ExactGeometry
          lake env bash -euc 'export LEAN_PATH="$PWD:$LEAN_PATH"; python3 ../qa/inclined-release/compile.py HingeFrameChecker InclinedFrameIntervalReactionsSound InclinedFrameIntervalReport'
      - uses: actions/cache/save@v4
        if: steps.proof-cache.outputs.cache-hit != 'true'
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-release-proof-v1-${{ steps.dependencies.outputs.key }}
      - name: Prove spring equilibrium, restoring couples and reported intervals
        working-directory: proofs
        run: |
          lake env bash -euc '
            set -o pipefail
            export LEAN_PATH="$PWD:$LEAN_PATH"
            python3 ../qa/inclined-release/compile.py FrameSpringSound | tee release-axioms.log
            ! grep -E "sorryAx|declaration uses .sorry." release-axioms.log
          '
