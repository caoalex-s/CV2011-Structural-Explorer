name: Replay published ideal truss
on:
  push:
    branches: [codex/verify-published-ideal-truss]
permissions:
  contents: read
jobs:
  public-offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PAGES_SITE: https://caoalex-s.github.io/CV2011-Structural-Explorer/
      RELEASE_COMMIT: a08e251f2c5941f1bb8664060416fb4dde07de41
      EVIDENCE: .data/public-ideal-truss
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify replay source and wait for the reviewed Pages revision
        run: |
          git diff --exit-code "$RELEASE_COMMIT" HEAD -- qa/ideal-truss/truss-exercise-student-replay.mjs qa/ideal-truss/truss-exercise-reference.mjs public/portal-checker
          node qa/ideal-truss/published-assets.mjs "$PAGES_SITE" "$RELEASE_COMMIT" "$EVIDENCE" before
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Replay synthetic offline drawing in a fresh browser
        run: |
          mkdir -p .data/independent
          cp qa/ideal-truss/truss-exercise-*.mjs .data/independent/
          node .data/independent/truss-exercise-student-replay.mjs "file://$PWD/.data/student-tools/node_modules/playwright/index.mjs" "$PAGES_SITE" "$EVIDENCE" offline
          node qa/ideal-truss/published-assets.mjs "$PAGES_SITE" "$RELEASE_COMMIT" "$EVIDENCE" after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truss-exercise-public
          path: .data/public-ideal-truss/
          include-hidden-files: true
