# REVIEW ONLY: never installed or dispatched during preparation.
# After explicit user approval, place this one file on main with [skip ci].
# The reviewed bundle belongs on a separate inert branch, never merged to main.
name: Approved immutable checker preview
on:
  workflow_dispatch:
    inputs:
      publication_and_one_test_approved:
        type: boolean
        required: true
        default: false
      human_approval_reference:
        type: string
        required: true
      bundle_commit:
        description: Exact 40-character SHA of the reviewed bundle staging commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish-reviewed-bytes:
    if: github.ref == 'refs/heads/main' && inputs.publication_and_one_test_approved == true
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.bundle_commit }}
          persist-credentials: false
      - name: Require exact reviewed payload and explicit approval reference
        env:
          BUNDLE_COMMIT: ${{ inputs.bundle_commit }}
          APPROVAL_REFERENCE: ${{ inputs.human_approval_reference }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, shutil, subprocess
          assert re.fullmatch('[0-9a-f]{40}', os.environ['BUNDLE_COMMIT'])
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['BUNDLE_COMMIT']
          assert os.environ['APPROVAL_REFERENCE'].strip()
          payload = pathlib.Path('checker-preview-review/prepared-pages.tar')
          assert hashlib.sha256(payload.read_bytes()).hexdigest() == '9e864102ecffd27e271145198a906f519743f71e7cf12e287c350cc8802b6dfc'
          pathlib.Path('.data/preview-upload').mkdir(parents=True)
          shutil.copyfile(payload, '.data/preview-upload/artifact.tar')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: .data/preview-upload/artifact.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
  one-fresh-https-browser-test:
    needs: publish-reviewed-bytes
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.bundle_commit }}
          persist-credentials: false
      - name: Bind the approved candidate, file manifest and test source before installation
        env:
          APPROVAL_REFERENCE: ${{ inputs.human_approval_reference }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('checker-preview-review')
          lock = root / 'preview-file-manifest.json'
          lock_hash = hashlib.sha256(lock.read_bytes()).hexdigest()
          assert lock_hash == 'a15732280331bdee86122669c3d4a660fe4eac216ea11d2e7184ed8190cdfd86'
          assert hashlib.sha256((root/'https-test.mjs').read_bytes()).hexdigest() == '21ba3c59b5f2ff3d31d9eb9747adc19f1e2e043c272c350291a95e40f498034f'
          assert os.environ['APPROVAL_REFERENCE'].strip()
          data = json.loads(lock.read_bytes())
          approval = dict(approved=True, candidate_commit=data['candidate_commit'], target_url=data['target_url'], lock_sha256=lock_hash, human_approval_reference=os.environ['APPROVAL_REFERENCE'])
          pathlib.Path('.data').mkdir(exist_ok=True)
          pathlib.Path('.data/publication-approval.json').write_text(json.dumps(approval))
          PY
      - name: Install only the pinned browser test dependency
        run: |
          npm install --prefix .data/preview-tools --ignore-scripts --save-exact playwright@1.51.1
          node .data/preview-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Execute once against the named HTTPS subtree
        run: |
          cp checker-preview-review/https-test.mjs .data/preview-tools/https-test.mjs
          timeout 240s node .data/preview-tools/https-test.mjs checker-preview-review/preview-file-manifest.json .data/publication-approval.json .data/public-preview-result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-preview-https-evidence
          path: |
            .data/public-preview-result/
            .data/preview-tools/package-lock.json
