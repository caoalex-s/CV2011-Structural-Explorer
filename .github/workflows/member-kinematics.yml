name: Verify member slopes and transverse displacements
on:
  push:
    branches: [codex/member-kinematics]
permissions:
  contents: read
  actions: read
jobs:
  diagrams:
    outputs:
      installed: ${{ steps.installation.outputs.installed }}
    if: "${{ !startsWith(github.event.head_commit.message, 'Proof iteration:') }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'true'
      - id: dependencies
        name: Identify unchanged proof dependencies
        run: echo "key=$(git ls-tree -r HEAD proofs | grep -Ev 'proofs/(MemberDiagram|CardinalSpring|JointMemberDiagram|InclinedDiagram|MemberKinematics)' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: proof-cache
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-cardinal-joint-deps-v2-${{ steps.dependencies.outputs.key }}
          restore-keys: linux-diagram-deps-v1-${{ steps.dependencies.outputs.key }}
      - name: Compile reusable interval mechanics
        if: steps.proof-cache.outputs.cache-hit != 'true'
        working-directory: proofs
        run: |
          lake build ExactGeometry
          lake env bash -euc 'export LEAN_PATH="$PWD:$LEAN_PATH"; python3 ../qa/inclined-release/compile.py RationalFrameSoundness FrameSpringSound HingeFrameSoundness'
      - uses: actions/cache/save@v4
        if: steps.proof-cache.outputs.cache-hit != 'true'
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-cardinal-joint-deps-v2-${{ steps.dependencies.outputs.key }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node qa/inclined-diagram/packets.mjs
      - run: node qa/member-kinematics/repeated-root.mjs
      - name: Compile and exercise the source-bound checker
        working-directory: proofs
        run: |
          lake env bash -euc '
            export LEAN_PATH="$PWD:$LEAN_PATH"
            python3 ../qa/inclined-release/compile.py FrameSpringWire HingeFrameWire
            for module in HingeFrameChecker HingeFrameWire InclinedRelease InclinedReleaseWire FrameSpring FrameSpringWire MemberDiagram InclinedDiagramStatics InclinedDiagram InclinedDiagramWire MemberKinematics MemberKinematicsWire; do
              lean -c "$module.c" -o "$module.olean" "$module.lean"
            done
            lean --run ../qa/member-kinematics/Native.lean ../.data/inclined-diagram/*.packet ../.data/inclined-diagram/*.reject
          '
      - run: node qa/member-kinematics/repeated-root.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: native-kinematics-reports
          path: .data/inclined-diagram/*.report
          include-hidden-files: true
      - name: Build browser checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash qa/member-diagram/build-runtime.sh member-kinematics
      - name: Compare installed checker with clean build
        id: installation
        run: |
          if test -d public/portal-checker/member-kinematics; then
            diff -qr public/portal-checker/member-kinematics .data/hinge-build/member-kinematics-assets
            echo "installed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: member-kinematics-checker
          path: .data/hinge-build/member-kinematics-assets/
          include-hidden-files: true

  soundness:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'true'
      - id: dependencies
        name: Identify unchanged proof dependencies
        run: echo "key=$(git ls-tree -r HEAD proofs | grep -Ev 'proofs/(MemberDiagram|CardinalSpring|JointMemberDiagram|InclinedDiagram|MemberKinematics)' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: proof-cache
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-cardinal-joint-deps-v2-${{ steps.dependencies.outputs.key }}
          restore-keys: linux-diagram-deps-v1-${{ steps.dependencies.outputs.key }}
      - name: Compile reusable interval mechanics
        if: steps.proof-cache.outputs.cache-hit != 'true'
        working-directory: proofs
        run: |
          lake build ExactGeometry
          lake env bash -euc 'export LEAN_PATH="$PWD:$LEAN_PATH"; python3 ../qa/inclined-release/compile.py RationalFrameSoundness FrameSpringSound HingeFrameSoundness'
      - uses: actions/cache/save@v4
        if: steps.proof-cache.outputs.cache-hit != 'true'
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-cardinal-joint-deps-v2-${{ steps.dependencies.outputs.key }}
      - name: Check source kinematics and extrema enclosures
        working-directory: proofs
        run: |
          lake env bash -euc '
            set -o pipefail
            export LEAN_PATH="$PWD:$LEAN_PATH"
            python3 ../qa/inclined-release/compile.py MemberKinematicsWireSound | tee kinematics-axioms.log
            for theorem in rigid_accepted released_accepted spring_accepted sheet_sound member_extreme physical_extreme_covered; do
              grep -F "MemberKinematics.Sound.$theorem" kinematics-axioms.log
            done
            ! grep -E "sorryAx|declaration uses .sorry." kinematics-axioms.log
          '

  student-drawings:
    needs: diagrams
    if: needs.diagrams.outputs.installed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: node scripts/check-inclined-bundle.mjs
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise ordinary drawing controls on the development site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/hinge-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for target in member-kinematics inclined-diagram diagram springs stage3 joint-diagram; do
            node qa/hinge-frame/run-student-browser.mjs http://127.0.0.1:8765/ "$target"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-canvas-development
          path: .data/student-results/
          include-hidden-files: true
