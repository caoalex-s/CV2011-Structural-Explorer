name: Review shared section
on:
  push:
    branches: [codex/shared-section]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Follow one cut through the drawing, free body and compiled checker
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/candidate.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
          node qa/shared-section/shared-cut-review-replay.mjs "file://$PWD/.data/student-tools/node_modules/playwright/index.mjs" http://127.0.0.1:8765/ .data/shared-evidence/cuts
      - name: Check course and import routes
        run: |
          playwright="file://$PWD/.data/student-tools/node_modules/playwright/index.mjs"
          node qa/drawing-workspace/layout.mjs
          node qa/editorial/navigation.mjs
          node qa/simple-beams/simple-beam-student-replay.mjs "$playwright" http://127.0.0.1:8765/ .data/shared-evidence/simple-beams offline
          fixture=qa/inclined-frame/published-fixtures/cantilever-interior
          node qa/frame-import/frame-import-review-replay.mjs "$playwright" http://127.0.0.1:8765/ "$fixture.request.json" "$fixture.report" .data/shared-evidence/import
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-section-preview
          path: .data/shared-evidence/
          include-hidden-files: true
