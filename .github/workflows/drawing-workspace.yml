name: Review sandbox drawing workspace
on:
  push:
    branches: [codex/drawing-workspace]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 43bd2c4c7b1b6e2ab3a7b731ed9731f41507d461
          path: .data/baseline
      - name: Build the approved baseline
        working-directory: .data/baseline
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
      - name: Compare drawing and editing on desktop and touch
        run: |
          python3 -m http.server 8764 --bind 127.0.0.1 --directory .data/baseline/dist > "$RUNNER_TEMP/baseline.log" 2>&1 &
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/candidate.log" 2>&1 &
          for port in 8764 8765; do
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:$port/ -o /dev/null && break; sleep 1; done
          done
          playwright="file://$PWD/.data/student-tools/node_modules/playwright/index.mjs"
          node qa/drawing-workspace/sandbox-interaction-review-replay.mjs "$playwright" http://127.0.0.1:8764/ http://127.0.0.1:8765/ .data/drawing-evidence/comparison
      - name: Check course and import routes
        run: |
          playwright="file://$PWD/.data/student-tools/node_modules/playwright/index.mjs"
          node qa/editorial/navigation.mjs
          node qa/simple-beams/simple-beam-student-replay.mjs "$playwright" http://127.0.0.1:8765/ .data/drawing-evidence/simple-beams offline
          fixture=qa/inclined-frame/published-fixtures/cantilever-interior
          node qa/frame-import/frame-import-review-replay.mjs "$playwright" http://127.0.0.1:8765/ "$fixture.request.json" "$fixture.report" .data/drawing-evidence/import
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawing-preview
          path: .data/drawing-evidence/
          include-hidden-files: true
