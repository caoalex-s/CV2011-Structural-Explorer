name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      proof_only:
        description: Run only Lean foundation checks
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ inputs.proof_only != true }}
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        if: ${{ inputs.proof_only != true }}
        with:
          version: '11.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: ${{ inputs.proof_only != true }}
      - run: pnpm run check
        if: ${{ inputs.proof_only != true }}
      - run: pnpm test
        if: ${{ inputs.proof_only != true }}
      - run: python -m pip install -r requirements.txt
        if: ${{ inputs.proof_only != true }}
      - run: mkdir -p .data && python -m unittest discover -s tests -p 'test_*.py' -v
        if: ${{ inputs.proof_only != true }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          build: 'true'
          build-args: '--wfail'
          test: 'false'
          use-mathlib-cache: 'true'
      - name: Confirm pinned dependency lock is unchanged
        run: git diff --exit-code -- proofs/lake-manifest.json
      - name: Audit formal proof axioms
        if: ${{ inputs.proof_only != true }}
        working-directory: proofs
        run: |
          lake env lean StructuralProofs.lean > axioms.log
          cat axioms.log
          if grep -E 'sorryAx|sorry|declaration uses' axioms.log; then exit 1; fi
      - name: Verify worked beam certificates and rejection tests
        if: ${{ inputs.proof_only != true }}
        run: python -m unittest discover -s tests -p 'test_worked.py' -v
        env:
          EXPLORER_LEAN: lean
          REQUIRE_LEAN: '1'
      - name: Check lesson theorem examples and reject false claims
        if: ${{ inputs.proof_only != true }}
        run: python -m unittest discover -s tests -p 'test_lesson_proofs.py' -v
        env:
          REQUIRE_LEAN: '1'
      - name: Check real-field theorem examples and reject false claims
        run: python -m unittest discover -s tests -p 'test_real_field_proofs.py' -v
        env:
          REQUIRE_LEAN: '1'
      - name: Check local frame-field positive and mutation fixtures
        run: python -m unittest discover -s tests -p 'test_local_frame_proofs.py' -v
        env:
          REQUIRE_LEAN: '1'
      - name: Check linked member-potential fixtures
        run: python -m unittest discover -s tests -p 'test_frame_potential_proofs.py' -v
        env:
          REQUIRE_LEAN: '1'
      - name: Check coordinate and member-side connection fixtures
        run: python -m unittest discover -s tests -p 'test_frame_transform_proofs.py' -v
        env:
          REQUIRE_LEAN: '1'
      - name: Audit real-field theorem axioms
        working-directory: proofs
        run: |
          lake env lean RealBeamAudit.lean > real-axioms.log
          python ../scripts/audit_real_axioms.py real-axioms.log
      - name: Audit local frame-field theorem axioms
        working-directory: proofs
        run: |
          lake env lean LocalFrameAudit.lean > frame-axioms.log
          python ../scripts/audit_real_axioms.py frame-axioms.log LocalFrameFields
      - name: Audit coordinate and connection theorem axioms
        working-directory: proofs
        run: |
          lake env lean FrameTransformAudit.lean > transform-axioms.log
          python ../scripts/audit_real_axioms.py transform-axioms.log FrameTransform
      - name: Audit local frame energy axioms
        working-directory: proofs
        run: |
          lake env lean FrameEnergyAudit.lean > energy-axioms.log
          python ../scripts/audit_real_axioms.py energy-axioms.log FrameEnergy
      - name: Audit frame virtual-work theorem axioms
        working-directory: proofs
        run: |
          lake env lean FrameVirtualWorkAudit.lean > virtual-work-axioms.log
          python ../scripts/audit_real_axioms.py virtual-work-axioms.log FrameVirtualWork
      - name: Audit linked member-potential theorem axioms
        working-directory: proofs
        run: |
          lake env lean FramePotentialAudit.lean > potential-axioms.log
          python ../scripts/audit_real_axioms.py potential-axioms.log FramePotential
      - name: Check presegmented assembly model fixtures
        run: python -m unittest discover -s tests -p 'test_frame_assembly_model_proofs.py' -v
        env:
          REQUIRE_LEAN: '1'
      - name: Check exact frame mechanism fixtures
        run: python -m unittest discover -s tests -p 'test_frame_mechanism_proofs.py' -v
        env:
          REQUIRE_LEAN: '1'
      - name: Audit presegmented assembly model axioms
        working-directory: proofs
        run: |
          lake env lean FrameAssemblyModelAudit.lean > assembly-model-axioms.log
          python ../scripts/audit_real_axioms.py assembly-model-axioms.log FrameAssemblyModel
      - name: Audit finite assembly theorem axioms
        working-directory: proofs
        run: |
          lake env lean FrameAssemblyAudit.lean > assembly-axioms.log
          python ../scripts/audit_real_axioms.py assembly-axioms.log FrameAssembly
      - name: Audit frame deformation theorem axioms
        working-directory: proofs
        run: |
          lake env lean FrameDeformationAudit.lean > deformation-axioms.log
          python ../scripts/audit_real_axioms.py deformation-axioms.log FrameDeformation
      - name: Audit fixed-structure reuse theorem axioms
        working-directory: proofs
        run: |
          lake env lean FrameReuseAudit.lean > reuse-axioms.log
          python ../scripts/audit_real_axioms.py reuse-axioms.log FrameReuse
      - name: Check public course examples
        if: ${{ inputs.proof_only != true }}
        run: python -m scripts.check_worked_examples
        env:
          EXPLORER_LEAN: lean
      - name: Record successfully checked proof scope
        if: ${{ inputs.proof_only != true }}
        run: |
          python -c "import json; from pathlib import Path; p=Path('web/verification.json'); v=json.loads(p.read_text()); v['lean']='checked'; v['commit']='${{ github.sha }}'; p.write_text(json.dumps(v))"
      - name: Record real-beam proof bundle
        if: ${{ inputs.proof_only != true }}
        run: node scripts/record-real-proof.mjs
      - name: Render published symbolic equations
        if: ${{ inputs.proof_only != true }}
        run: node scripts/check_published_math.mjs
      - run: pnpm run build
        if: ${{ inputs.proof_only != true }}
        env:
          EXPLORER_BASE: /CV2011-Structural-Explorer/
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.proof_only != true }}
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.proof_only != true
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
