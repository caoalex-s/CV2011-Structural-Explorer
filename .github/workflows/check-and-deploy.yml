name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p .data && python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          build: 'true'
          build-args: '--wfail'
          test: 'false'
          use-mathlib-cache: 'false'
      - name: Audit formal proof axioms
        working-directory: proofs
        run: |
          lake env lean StructuralProofs.lean > axioms.log
          cat axioms.log
          if grep -E 'sorryAx|sorry|declaration uses' axioms.log; then exit 1; fi
      - name: Verify worked beam certificates and rejection tests
        run: python -m unittest discover -s tests -p 'test_worked.py' -v
        env:
          EXPLORER_LEAN: lean
          REQUIRE_LEAN: '1'
      - name: Check public course examples
        run: python -m scripts.check_worked_examples
        env:
          EXPLORER_LEAN: lean
      - name: Record successfully checked proof scope
        run: |
          python -c "import json; from pathlib import Path; p=Path('web/verification.json'); v=json.loads(p.read_text()); v['lean']='checked'; v['commit']='${{ github.sha }}'; p.write_text(json.dumps(v))"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
