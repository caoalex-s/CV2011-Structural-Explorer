name: Verify whole-member diagrams
on:
  push:
    branches: [codex/whole-member-diagrams]
permissions:
  contents: read
  actions: read
jobs:
  diagrams:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'true'
      - id: dependencies
        name: Identify unchanged proof dependencies
        run: echo "key=$(git ls-tree -r HEAD proofs | grep -v 'proofs/MemberDiagram' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: proof-cache
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-diagram-deps-v1-${{ steps.dependencies.outputs.key }}
      - name: Compile reusable interval mechanics
        if: steps.proof-cache.outputs.cache-hit != 'true'
        working-directory: proofs
        run: |
          lake build ExactGeometry
          lake env bash -euc 'export LEAN_PATH="$PWD:$LEAN_PATH"; python3 ../qa/inclined-release/compile.py RationalFrameSoundness RationalFrameWire'
      - uses: actions/cache/save@v4
        if: steps.proof-cache.outputs.cache-hit != 'true'
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-diagram-deps-v1-${{ steps.dependencies.outputs.key }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node qa/member-diagram/packets.mjs
      - name: Compile and exercise the source-bound checker
        working-directory: proofs
        run: |
          lake env bash -euc 'export LEAN_PATH="$PWD:$LEAN_PATH"; lean -c MemberDiagram.c -o MemberDiagram.olean MemberDiagram.lean; lean --run ../qa/member-diagram/Native.lean ../.data/diagram/*.packet ../.data/diagram/*.reject'
          cat ../.data/diagram/portal.packet.report
          grep -Fx "M 0 interior 3/1 3/1 -9/1 -9/1 0 0" ../.data/diagram/repeated-root.packet.report
      - name: Build browser checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash qa/member-diagram/build-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: member-diagram-checker
          path: .data/hinge-build/diagram-assets/
          include-hidden-files: true

  soundness:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'true'
      - id: dependencies
        name: Identify unchanged proof dependencies
        run: echo "key=$(git ls-tree -r HEAD proofs | grep -v 'proofs/MemberDiagram' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: proof-cache
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-diagram-deps-v1-${{ steps.dependencies.outputs.key }}
      - name: Compile reusable interval mechanics
        if: steps.proof-cache.outputs.cache-hit != 'true'
        working-directory: proofs
        run: |
          lake build ExactGeometry
          lake env bash -euc 'export LEAN_PATH="$PWD:$LEAN_PATH"; python3 ../qa/inclined-release/compile.py RationalFrameSoundness RationalFrameWire'
      - uses: actions/cache/save@v4
        if: steps.proof-cache.outputs.cache-hit != 'true'
        with:
          path: |
            proofs/*.olean
            proofs/.lake/build
          key: linux-diagram-deps-v1-${{ steps.dependencies.outputs.key }}
      - name: Prove whole-member diagram certificates
        working-directory: proofs
        run: |
          lake env bash -euc '
            set -o pipefail
            export LEAN_PATH="$PWD:$LEAN_PATH"
            test -s MemberDiagramReport.lean
            python3 ../qa/inclined-release/compile.py MemberDiagramReport | tee release-axioms.log
            grep -F "MemberDiagram.Sound.accepted_report" release-axioms.log
            ! grep -E "sorryAx|declaration uses .sorry." release-axioms.log
          '

  student-drawings:
    needs: diagrams
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: node scripts/check-inclined-bundle.mjs
      - uses: actions/download-artifact@v4
        with:
          name: member-diagram-checker
          path: public/portal-checker/diagram
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise ordinary drawing controls on the development site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/hinge-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node qa/hinge-frame/run-student-browser.mjs http://127.0.0.1:8765/ diagram
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-canvas-development
          path: .data/student-results/
          include-hidden-files: true
