name: Check Simple beams
on:
  push:
    branches: [codex/course-simple-beams]
permissions:
  contents: read
  actions: read
jobs:
  student:
    strategy:
      fail-fast: false
      matrix:
        mode: [offline, pilot]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: npm install --prefix .data/student-tools --ignore-scripts --save-exact playwright@1.51.1
      - run: node .data/student-tools/node_modules/playwright/cli.js install --with-deps chromium
      - run: python3 -m pip install -r requirements.txt
        if: matrix.mode == 'pilot'
      - name: Exercise a student drawing in a fresh browser
        env:
          REPLAY_MODE: ${{ matrix.mode }}
        run: |
          if [[ "$REPLAY_MODE" == pilot ]]; then
            EXPLORER_DATA="$RUNNER_TEMP/beam-synthetic" python3 -m server.app --port 8765 > "$RUNNER_TEMP/beam-server.log" 2>&1 &
          else
            python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/beam-server.log" 2>&1 &
          fi
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
          node qa/simple-beams/simple-beam-student-replay.mjs "file://$PWD/.data/student-tools/node_modules/playwright/index.mjs" http://127.0.0.1:8765/ ".data/student-results/$REPLAY_MODE" "$REPLAY_MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-student-${{ matrix.mode }}
          path: .data/student-results/
          include-hidden-files: true
